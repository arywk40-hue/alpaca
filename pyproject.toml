[project]
name = "vegaguard"
version = "0.1.0"
description = "Autonomous, risk-gated paper-options trading agent using Alpaca MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
  "openai>=1.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
vegaguard = "vegaguard.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
